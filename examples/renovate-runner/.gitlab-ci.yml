# The include a private runner project uses. The runner project must stay
# private: it holds the RENOVATE_TOKEN, and a token that can open and merge
# merge requests across the group does not belong in a public mirror. Give
# the token to a group bot account, never to a person's account.
#
# Pin the full commit SHA of the release tag, with the tag in a trailing
# comment.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/renovate@fb73b538f3980292119b5b306ff64383d760a214 # 0.9.0
    inputs:
      git_author: "Preflight Bot <preflight-bot@example.com>"
      dry_run: "null"
