# A mirrored package calls the reusable workflow from its own
# .github/workflows/ci.yml. Copy this file and change the `uses:` ref.
#
# Pin the tag, the same rule as the GitLab components. `0.1.1` is the first
# tag that carries this workflow; `0.1.0` predates it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

jobs:
  ci:
    uses: waynestate/preflight/.github/workflows/php-package.yml@0.1.1
