# Tests the components of this project against the fixture app.
# Note: $CI_COMMIT_SHA testing requires this project to be on the same
# GitLab instance as the runner. Components cannot be used across instances.
# Docker Hub images in this repo's own pipeline go through the GitLab
# Dependency Proxy to avoid the anonymous pull limit. The components put
# their image_prefix input (default: the proxy) in front of their image, so
# the includes below pass no image; tests/check-dependency-cache.sh fails
# if one does, or if a job here pulls from Docker Hub directly.
include:
  # The real PROCTOR (fixture-app require-dev), on the component's default command.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/proctor@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/php-test@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
      test_command: vendor/bin/phpunit
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/composer-audit@$CI_COMMIT_SHA
    inputs:
      stage: audit
      working_dir: tests/fixture-app
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/sbom@$CI_COMMIT_SHA
    inputs:
      stage: audit
  # The npm-audit component at this commit, on a lock with no advisory: it
  # must pass. must-fail-npm-audit below proves a known advisory fails.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/npm-audit@$CI_COMMIT_SHA
    inputs:
      stage: audit
      working_dir: tests/npm-audit-fixtures/clean
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/pint@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/phpstan@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
  # Preflight's own front page and docs, checked by the a11y component at
  # this commit with the stack's floor, WCAG 2.2 AA. The Playwright image is
  # on Microsoft's registry, not Docker Hub, so it skips the Dependency Proxy.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/a11y@$CI_COMMIT_SHA
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]
  # The squire-kit component at this commit, on a kit Squire wrote
  # (tests/squire-kit-fixture, from squire init --target=raw). Renovate moves
  # the fixture with each Squire release, like any kit.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/squire-kit@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/squire-kit-fixture
  # The portability component at this commit, on the clean fixture: it must
  # pass. must-fail-portability below proves each flaw still fails. The
  # fixture's base image comes through the Dependency Proxy; the probe
  # replaces ${NAME} in build_args and env from the job's variables.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/portability@$CI_COMMIT_SHA
    inputs:
      context: tests/portability/app
      build_args: ["BASE_REGISTRY=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}", "FLAW=none"]
      env: ["APP_URL=http://portability.invalid", "APP_KEY=portability-fixture-key-not-a-secret"]
      session_login_path: /login
      session_check_path: /me
  # The mysql56-migrate component at this commit, on the clean fixture: it
  # must pass. must-fail-mysql56-migrate below proves a JSON column and a
  # too-long utf8mb4 index still fail. Both jobs carry the amd64 tag because
  # the official MySQL 5.6 images are amd64 only; the component's baked rules
  # run it on the default branch and tags, make it manual on merge requests,
  # and keep it off schedules.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/mysql56-migrate@$CI_COMMIT_SHA
    inputs:
      migrate_command: php tests/mysql56-migrate/migrate.php tests/mysql56-migrate/clean
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - audit
  - release

# GitLab's secret detection template marks its job allow_failure: true.
# Preflight's own pipeline overrides that, so a committed secret fails the
# run. tests/check-secret-detection checks this block is here.
secret_detection:
  allow_failure: false

# The inputs contract: templates must keep the inputs and job names they
# promised in contract/inputs.json (BEST_PRACTICES.md 1.4). Runs on the
# mikefarah/yq image, pinned by digest.
contract:
  stage: test
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/mikefarah/yq@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
    entrypoint: [""]
  script:
    - sh tests/check-contract.sh
    - sh tests/check-contract-fails.sh
    - sh tests/check-php-test-cache.sh
    - sh tests/check-proctor-cache.sh
    - sh tests/check-proctor-fails.sh
    - sh tests/check-image-inputs.sh
    - sh tests/check-dependency-cache.sh
    - sh tests/check-buildah-pin.sh
    - sh tests/check-working-dir-regex.sh
    - sh tests/check-path-input-regex.sh
    - sh tests/check-spec-keys.sh
    - sh tests/check-component-version.sh
    - sh tests/check-job-names.sh
    - sh tests/check-input-interpolation.sh
    - sh tests/check-proctor-install-flags.sh
    - sh tests/check-secret-detection.sh
    - sh tests/check-renovate-review.sh
    - sh tests/check-renovate-buildah.sh
    - sh tests/check-sha-pins.sh
    - sh tests/check-release-job.sh
    - sh tests/check-a11y-inline.sh
    - sh tests/check-portability-inline.sh
    - sh tests/check-renovate-squire-kit.sh
    - sh tests/check-squire-kit.sh
    - sh tests/check-composer-floor.sh
    - sh tests/check-abandoned-input.sh
    - sh tests/check-php-matrix.sh
    - sh tests/check-image-inputs-fails.sh
    - sh tests/check-cache-fails.sh
    - sh tests/check-php-matrix-fails.sh

# The must-fail fixture for the php-test component: the check proves the
# template keeps the job line that lets the tool's exit code be the job
# result. Runs in the template's own image, pinned by digest, so it needs
# no Docker.
must-fail-php-test:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.3-cli-trixie@sha256:628102249d93494233b54490b785f12db9cd60f4dc89416dfca15973f2125f10
  script:
    - sh tests/check-php-test-fails.sh

# The must-fail fixtures for the phpstan and pint components: the checks
# prove the templates keep the job lines that let the tools' exit codes be
# the job results. Run in the templates' own image, pinned by digest, so
# they need no Docker.
must-fail-phpstan-pint:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - sh tests/check-phpstan-fails.sh
    - sh tests/check-pint-fails.sh

# The must-fail fixture for the eslint component: the check proves the
# template keeps the job lines that let ESLint's and Prettier's exit codes
# be the job result. Runs in the template's own image, pinned by digest, so
# it needs no Docker. npm downloads land in .npm-cache/ under a fixed key,
# so repeat pipelines skip them.
must-fail-eslint:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22.13-alpine@sha256:e2b39f7b64281324929257d0f8004fb6cb4bf0fdfb9aa8cedb235a766aec31da
  cache:
    key: preflight-must-fail-eslint
    paths:
      - .npm-cache/
    when: always  # a failed job still keeps every package that finished downloading
  script:
    - sh tests/check-eslint-fails.sh

# The must-fail fixture for the package-publish component: the check proves
# the template keeps the offline guards (a non-semantic-version tag and a
# missing composer.json stop the release) and runs them on two fixtures.
# Runs in the template's own image, pinned by digest, so it needs no Docker;
# it downloads nothing, so it keeps no cache.
must-fail-package-publish:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - sh tests/check-package-publish-fails.sh

# The must-fail fixtures for the composer-audit component: the check proves
# the template keeps the job honest (no allow_failure, no
# --ignore-unreachable, no swallowed exit code), then runs the template's
# own script lines on four locks: the clean fixture app passes, and a known
# advisory (laravel/framework v9.0.0, CVE-2024-52301) and a malware-flagged
# version (aikido/endpoint-test 0.0.1, Aikido's harmless test package) fail
# in every abandoned mode, while an abandoned package fails only in fail
# mode. composer audit asks Packagist for advisories and filter lists, so
# this job needs outbound HTTPS, like the component; it downloads no
# packages, so it keeps no cache. Runs in the template's own image, pinned
# by digest.
must-fail-composer-audit:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - sh tests/check-composer-audit-fails.sh

# The must-fail fixture for PROCTOR's lock-committed check: the check proves
# row 4.5 with the real PROCTOR (installed from the fixture app's own lock)
# on copies of tests/fixture-app: a clean copy passes and names no lock
# finding, and a copy without composer.lock fails and names
# proctor/lock-committed. Composer recreates a missing lock while
# installing, so the script deletes it after the install, right before the
# check. It needs Packagist, like the install: composer downloads land in
# .composer-cache/ under a fixed key, so repeat pipelines skip them. Runs
# in the template's own image, pinned by digest.
must-fail-proctor-lock:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  cache:
    key: preflight-must-fail-proctor-lock
    paths:
      - .composer-cache/
    when: always  # a failed job still keeps every package that finished downloading
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - sh tests/check-proctor-lock-fails.sh

# The warn-only fixtures for PROCTOR's preflight-gates and preflight-pinned
# checks: the check proves row 3.3 with the real PROCTOR on a copy of
# tests/fixture-app whose .gitlab-ci.yml is swapped per case: as-is it warns
# no-include and no-proctor-job, an include pinned to a release tag with
# allow_failure: true warns allow-failure, and an include at @main warns
# unpinned. Every case exits 0: the warnings never fail the run. It needs
# Packagist once, for the install: composer downloads land in
# .composer-cache/ under a fixed key, so repeat pipelines skip them. Runs
# in the template's own image, pinned by digest.
must-warn-preflight-gates:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  cache:
    key: preflight-must-warn-gates
    paths:
      - .composer-cache/
    when: always  # a failed job still keeps every package that finished downloading
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - sh tests/check-preflight-gates-warns.sh

# The must-fail fixtures for the npm-audit component: the check proves the
# template keeps the job honest (no allow_failure, the gate's exit code
# kept, the one || true on the report line only, the .npmrc override flags
# in place), then runs the template's own script on fixed locks: lodash
# 4.17.20 (GHSA-35jh-r3h4-6jhm, high) fails at high and medium and passes at
# critical, an .npmrc that turns the audit off still fails, a dev-only
# finding fails only with omit_dev false, and a clean lock, an app with no
# lock and an unreachable registry behave as the docs say. npm audit asks
# the registry, so this job needs outbound HTTPS, like the component; it
# installs nothing, so it keeps no cache. Runs in the template's own image,
# pinned by digest.
must-fail-npm-audit:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22.13-alpine@sha256:e2b39f7b64281324929257d0f8004fb6cb4bf0fdfb9aa8cedb235a766aec31da
  script:
    - sh tests/check-npm-audit-fails.sh

# The must-fail fixture for the secret-detection component: the check proves
# the template keeps the gitleaks dir line that lets Gitleaks' exit code be
# the job result, then runs the template's own command, with the template's
# own config, against the clean fixture and a copy of it carrying a token in
# src/config.php. The token is built at run time, so no secret-shaped string
# is ever committed. Runs in the template's own image, pinned by digest, so
# it needs no Docker; it downloads nothing, so it keeps no cache.
must-fail-secret-detection:
  stage: test
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  script:
    - sh tests/check-secret-detection-fails.sh

# The must-fail fixture for the sbom component: the check proves the
# template keeps the job lines that let Composer's exit code be the job
# result, and that the omit_dev=true branch keeps --omit=dev. Runs in the
# template's own image, pinned by digest, so it needs no Docker. Composer
# downloads land in .composer-cache/ under a fixed key, so repeat
# pipelines skip them.
must-fail-sbom:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  cache:
    key: preflight-must-fail-sbom
    paths:
      - .composer-cache/
    when: always  # a failed job still keeps every package that finished downloading
  script:
    - sh tests/check-sbom-fails.sh

# The must-fail fixture for the squire-kit component: the check renders the
# template's own script and runs it against the clean kit in
# tests/squire-kit-fixture (must pass), a copy with a line appended to
# .squire/php-web.ini (must fail, naming the file) and a copy with no
# .squire.json (must stop with exit 2). The broken copies are built at run
# time, so no broken kit is committed. It needs Packagist, like the
# component: the script installs the Squire release the kit records. Runs
# in the template's own image, pinned by digest. Composer downloads land in
# .composer-cache/ under a fixed key, so repeat pipelines skip them.
must-fail-squire-kit:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  cache:
    key: preflight-must-fail-squire-kit
    paths:
      - .composer-cache/
    when: always  # a failed job still keeps every package that finished downloading
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - sh tests/check-squire-kit-fails.sh

# The must-fail fixture for the a11y component: the check proves the checker
# still passes a clean site and fails a bad one with each flaw named. Runs in
# the component's own Playwright image, pinned by digest, so it needs no
# Docker; the image is on Microsoft's registry, not Docker Hub, so it skips
# the Dependency Proxy. npm downloads land in .npm-cache/ under a fixed key,
# so repeat pipelines skip them.
must-fail-a11y:
  stage: test
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
  interruptible: true
  timeout: 30 minutes
  cache:
    key: preflight-must-fail-a11y
    paths:
      - .npm-cache/
    when: always  # a failed job still keeps every package that finished downloading
  variables:
    A11Y_IN_IMAGE: "1"
    NPM_CONFIG_UPDATE_NOTIFIER: "false"
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm-cache"
  script:
    - sh tests/check-a11y.sh

# The must-fail fixtures for the portability component: the check runs the
# component's own probe (templates/portability/probe.sh, which the template
# carries byte for byte) on the clean fixture, on nine flawed builds of it
# and on two that only Buildah alone would refuse (Apache's stdio reopen
# and group signal), and passes only when the clean and the two regression
# builds pass and each flaw fails the check it targets. Runs in the component's own Buildah image, pinned by
# digest; it needs user namespaces, not a privileged runner. quay.io, not
# Docker Hub, so it skips the Dependency Proxy.
must-fail-portability:
  stage: test
  image: quay.io/buildah/stable:v1.43.5-immutable@sha256:7c2b605262748ace2c5c57c5550942d0adad57aec82ede3070927722306c0ffb
  interruptible: true
  timeout: 30 minutes
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - sh tests/check-portability.sh

# The must-fail fixtures for the mysql56-migrate component: the check runs
# the fixture migrator against the same MySQL 5.6.51 service and proves the
# clean migration passes while a JSON column and a too-long utf8mb4 index
# fail with the server errors 5.6 reports. It carries the amd64 tag for the
# same reason as the component job: the official MySQL 5.6 images are amd64
# only. Its rules match the component's baked gating, so the proof does not
# add ungated load to the small shared amd64 host.
must-fail-mysql56-migrate:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.3-cli-trixie@sha256:628102249d93494233b54490b785f12db9cd60f4dc89416dfca15973f2125f10
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/mysql:5.6.51@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae
      alias: mysql
  tags: [amd64]
  interruptible: true
  timeout: 30 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
    - when: never
  variables:
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: app
    DB_USERNAME: app
    DB_PASSWORD: preflight-mysql56-ci
    MYSQL_ROOT_PASSWORD: preflight-mysql56-ci
    MYSQL_DATABASE: app
    MYSQL_USER: app
    MYSQL_PASSWORD: preflight-mysql56-ci
  script:
    - docker-php-ext-install pdo_mysql
    - sh tests/check-mysql56-migrate.sh

# Creates the GitLab Release for a pushed tag. It posts to the Releases API
# with curl because the runner is arm64 and the official GitLab image
# for creating releases has no arm64 build. The project's job token must be
# allowed to create releases (job token allowlist), and the job sits in its
# own stage after test and audit: stages run in order, so a failed test or
# audit job stops the pipeline before a release is created.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  interruptible: false
  timeout: 10 minutes
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    entrypoint: [""]
  script:
    - |
      curl --fail --silent --show-error --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data "$(printf '{"name":"Preflight %s","tag_name":"%s","ref":"%s","description":"Commit: %s\\nPin: preflight/<component>@%s # %s\\nChanges: see CHANGELOG.md under %s."}' "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$CI_COMMIT_SHA" "$CI_COMMIT_SHA" "$CI_COMMIT_SHA" "$CI_COMMIT_TAG" "$CI_COMMIT_TAG")"
