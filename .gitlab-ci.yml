# Tests the components of this project against the fixture app.
# Note: $CI_COMMIT_SHA testing requires this project to be on the same
# GitLab instance as the runner. Components cannot be used across instances.
# Docker Hub images in this repo's own pipeline go through the GitLab
# Dependency Proxy to avoid the anonymous pull limit. Component defaults
# stay unprefixed because other GitLab instances may have no proxy.
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/proctor@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
      proctor_command: bin/proctor check --format=codequality
      image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/php-test@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
      test_command: vendor/bin/phpunit
      image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:${PHP_VERSION}-cli-trixie
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/composer-audit@$CI_COMMIT_SHA
    inputs:
      stage: audit
      working_dir: tests/fixture-app
      image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/sbom@$CI_COMMIT_SHA
    inputs:
      stage: audit
      image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/pint@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
      image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/phpstan@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
      image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - audit
  - release

# The inputs contract: templates must keep the inputs and job names they
# promised in contract/inputs.json (BEST_PRACTICES.md 1.4). Runs on the
# mikefarah/yq image, pinned by digest.
contract:
  stage: test
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/mikefarah/yq@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
    entrypoint: [""]
  script:
    - sh tests/check-contract.sh
    - sh tests/check-php-test-cache.sh
    - sh tests/check-proctor-cache.sh
    - sh tests/check-image-inputs.sh
    - sh tests/check-buildah-pin.sh
    - sh tests/check-working-dir-regex.sh
    - sh tests/check-path-input-regex.sh
    - sh tests/check-spec-keys.sh
    - sh tests/check-job-names.sh
    - sh tests/check-proctor-install-flags.sh
    - sh tests/check-secret-detection.sh
    - sh tests/check-renovate-review.sh
    - sh tests/check-renovate-buildah.sh
    - sh tests/check-sha-pins.sh
    - sh tests/check-release-job.sh

# Advisory for now: secret detection is new here. Dated 2026-11-02: make this
# job blocking (remove allow_failure) after one week of green pipelines.
secret_detection:
  allow_failure: true

# Creates the GitLab Release for a pushed tag. It posts to the Releases API
# with curl because the nougat runner is arm64 and the official GitLab image
# for creating releases has no arm64 build. The project's job token must be
# allowed to create releases (job token allowlist), and the job sits in its
# own stage after test and audit: stages run in order, so a failed test or
# audit job stops the pipeline before a release is created.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  interruptible: false
  timeout: 10 minutes
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    entrypoint: [""]
  script:
    - |
      curl --fail --silent --show-error --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data "$(printf '{"name":"Preflight %s","tag_name":"%s","ref":"%s","description":"Commit: %s\\nPin: preflight/<component>@%s # %s\\nChanges: see CHANGELOG.md under %s."}' "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$CI_COMMIT_SHA" "$CI_COMMIT_SHA" "$CI_COMMIT_SHA" "$CI_COMMIT_TAG" "$CI_COMMIT_TAG")"
