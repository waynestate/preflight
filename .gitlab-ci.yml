# Tests the components of this project against the fixture app.
# Note: $CI_COMMIT_SHA testing requires this project to be on the same
# GitLab instance as the runner. Components cannot be used across instances.
# Docker Hub images in this repo's own pipeline go through the GitLab
# Dependency Proxy to avoid the anonymous pull limit. The components put
# their image_prefix input (default: the proxy) in front of their image, so
# the includes below pass no image; tests/check-dependency-cache.sh fails
# if one does, or if a job here pulls from Docker Hub directly.
include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/proctor@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
      proctor_command: bin/proctor check --format=codequality
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/php-test@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
      test_command: vendor/bin/phpunit
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/composer-audit@$CI_COMMIT_SHA
    inputs:
      stage: audit
      working_dir: tests/fixture-app
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/sbom@$CI_COMMIT_SHA
    inputs:
      stage: audit
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/pint@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/phpstan@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/fixture-app
  # Preflight's own front page and docs, checked by the a11y component at
  # this commit with the stack's floor, WCAG 2.2 AA. The Playwright image is
  # on Microsoft's registry, not Docker Hub, so it skips the Dependency Proxy.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/a11y@$CI_COMMIT_SHA
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]
  # The squire-kit component at this commit, on a kit Squire wrote
  # (tests/squire-kit-fixture, from squire init --target=raw). Renovate moves
  # the fixture with each Squire release, like any kit.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/squire-kit@$CI_COMMIT_SHA
    inputs:
      working_dir: tests/squire-kit-fixture
  # The portability component at this commit, on the clean fixture: it must
  # pass. must-fail-portability below proves each flaw still fails. The
  # fixture's base image comes through the Dependency Proxy; the probe
  # replaces ${NAME} in build_args and env from the job's variables.
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/portability@$CI_COMMIT_SHA
    inputs:
      context: tests/portability/app
      build_args: ["BASE_REGISTRY=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}", "FLAW=none"]
      env: ["APP_URL=http://portability.invalid", "APP_KEY=portability-fixture-key-not-a-secret"]
      session_login_path: /login
      session_check_path: /me
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - audit
  - release

# The inputs contract: templates must keep the inputs and job names they
# promised in contract/inputs.json (BEST_PRACTICES.md 1.4). Runs on the
# mikefarah/yq image, pinned by digest.
contract:
  stage: test
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/mikefarah/yq@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
    entrypoint: [""]
  script:
    - sh tests/check-contract.sh
    - sh tests/check-php-test-cache.sh
    - sh tests/check-proctor-cache.sh
    - sh tests/check-proctor-fails.sh
    - sh tests/check-image-inputs.sh
    - sh tests/check-dependency-cache.sh
    - sh tests/check-buildah-pin.sh
    - sh tests/check-working-dir-regex.sh
    - sh tests/check-path-input-regex.sh
    - sh tests/check-spec-keys.sh
    - sh tests/check-component-version.sh
    - sh tests/check-job-names.sh
    - sh tests/check-input-interpolation.sh
    - sh tests/check-proctor-install-flags.sh
    - sh tests/check-secret-detection.sh
    - sh tests/check-renovate-review.sh
    - sh tests/check-renovate-buildah.sh
    - sh tests/check-sha-pins.sh
    - sh tests/check-release-job.sh
    - sh tests/check-a11y-inline.sh
    - sh tests/check-portability-inline.sh
    - sh tests/check-renovate-squire-kit.sh
    - sh tests/check-squire-kit.sh

# The must-fail fixture for the php-test component: the check proves the
# template keeps the job line that lets the tool's exit code be the job
# result. Runs in the template's own image, pinned by digest, so it needs
# no Docker.
must-fail-php-test:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.3-cli-trixie@sha256:628102249d93494233b54490b785f12db9cd60f4dc89416dfca15973f2125f10
  script:
    - sh tests/check-php-test-fails.sh

# The must-fail fixtures for the phpstan and pint components: the checks
# prove the templates keep the job lines that let the tools' exit codes be
# the job results. Run in the templates' own image, pinned by digest, so
# they need no Docker.
must-fail-phpstan-pint:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
  script:
    - sh tests/check-phpstan-fails.sh
    - sh tests/check-pint-fails.sh

# The must-fail fixtures for the portability component: the check runs the
# component's own probe (templates/portability/probe.sh, which the template
# carries byte for byte) on the clean fixture and on nine flawed builds of
# it, and passes only when the clean one passes and each flaw fails the
# check it targets. Runs in the component's own Buildah image, pinned by
# digest; it needs user namespaces, not a privileged runner. quay.io, not
# Docker Hub, so it skips the Dependency Proxy.
must-fail-portability:
  stage: test
  image: quay.io/buildah/stable:v1.43.5-immutable@sha256:7c2b605262748ace2c5c57c5550942d0adad57aec82ede3070927722306c0ffb
  interruptible: true
  timeout: 30 minutes
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - sh tests/check-portability.sh

# Advisory for now: secret detection is new here. Dated 2026-11-02: make this
# job blocking (remove allow_failure) after one week of green pipelines.
secret_detection:
  allow_failure: true

# Creates the GitLab Release for a pushed tag. It posts to the Releases API
# with curl because the runner is arm64 and the official GitLab image
# for creating releases has no arm64 build. The project's job token must be
# allowed to create releases (job token allowlist), and the job sits in its
# own stage after test and audit: stages run in order, so a failed test or
# audit job stops the pipeline before a release is created.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  interruptible: false
  timeout: 10 minutes
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    entrypoint: [""]
  script:
    - |
      curl --fail --silent --show-error --request POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases" --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" --data "$(printf '{"name":"Preflight %s","tag_name":"%s","ref":"%s","description":"Commit: %s\\nPin: preflight/<component>@%s # %s\\nChanges: see CHANGELOG.md under %s."}' "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$CI_COMMIT_SHA" "$CI_COMMIT_SHA" "$CI_COMMIT_SHA" "$CI_COMMIT_TAG" "$CI_COMMIT_TAG")"
