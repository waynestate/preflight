# The fixture app's checks on the GitHub mirror, in the shape of a mirrored
# package: it calls Preflight's reusable workflow, pinned at the release
# tag's commit SHA. `ci-command` is set explicitly, so PROCTOR's
# ci-pipelines check sees composer ci without opening the callee.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: waynestate/preflight/.github/workflows/php-package.yml@60314791565a264e97cb210813ef4f3e76512402 # 0.5.0
    with:
      ci-command: composer ci
