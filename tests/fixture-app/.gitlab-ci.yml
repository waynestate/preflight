# The fixture app's own pipeline, in the shape of a small stack app: install
# from the lock, then run the checks kept in the `ci` script of composer.json.
# Preflight's proctor job runs the real PROCTOR on this app, and PROCTOR's
# ci-pipelines check reads this file and .github/workflows/ci.yml.
image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3@sha256:2cf275428757e5435a667bfc0d038b14520ca02be2b1b70d44a05c8c19e2de48

variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

cache:
  key: preflight-fixture
  paths:
    - .composer-cache/
  policy: pull-push
  when: always

ci:
  script:
    - composer install --no-interaction --no-progress
    - composer ci
