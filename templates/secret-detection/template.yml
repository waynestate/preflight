spec:
  component: [name, version, sha, reference]
  inputs:
    stage:
      description: Pipeline stage for the secret-detection job.
      type: string
      default: test
    job_name:
      type: string
      default: secret-detection
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      description: Docker image for the secret-detection job.
      type: string
      default: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    config_path:
      description: Path to a .gitleaks.toml config file, relative to the project root. Empty uses the built-in rules plus a path allowlist for vendor/ and node_modules/. When set, your file replaces the default, so add the same vendor and node_modules path allowlist to it.
      type: string
      default: ""
      regex: '^([A-Za-z0-9_-][A-Za-z0-9._/-]*)?$'
    allow_failure:
      description: Whether the secret-detection job can fail without failing the pipeline.
      type: boolean
      default: false
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  # The gitleaks image's ENTRYPOINT is the gitleaks binary itself, and
  # GitLab's Docker executor passes the job script to the image's entrypoint,
  # so the job overrides it with an empty entrypoint and the script runs
  # through /bin/sh. The image is Alpine-based with /bin/sh (checked
  # 2026-11-06: sh -c 'echo ok; gitleaks version' prints ok and v8.30.1),
  # and the script below is plain POSIX sh. The default is v8.30.1
  # (published 2026-03-21) pinned by digest: the digest is a multi-arch
  # manifest list holding linux/amd64 and linux/arm64, confirmed on
  # 2026-11-06 with docker buildx imagetools inspect, so the arm64 CI runner
  # pulls the right architecture.
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  # Boolean input interpolated as a real YAML boolean (docs: an input that
  # replaces an entire YAML value is interpolated as its specified type).
  allow_failure: $[[ inputs.allow_failure ]]
  interruptible: true
  timeout: 30 minutes
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    # --redact keeps any found secret out of the job log and the report: only
    # the rule, file and line are shown. The JSON report is written at the
    # project root even when the tree is clean, so the artifact path is the
    # same for every checkout. In dir mode Gitleaks reads a .gitleaksignore
    # at the project root without an extra flag.
    - |
      set -eu

      # Gitleaks scans whatever is checked out, and a CI cache can restore
      # vendor/ and node_modules/, so the dependency trees would raise
      # findings that are not our code. When no config_path is set, the job
      # writes this default config to /tmp, outside the scanned tree: the
      # built-in rules plus a path allowlist for the two trees. When a
      # config_path is set, the user's file is used as is, unchanged.
      cat > /tmp/gitleaks-preflight.toml <<'TOML'
      [extend]
      useDefault = true

      [allowlist]
      description = "skip dependency trees: vendor and node_modules are not our code"
      paths = ['''(^|/)vendor/''', '''(^|/)node_modules/''']
      TOML

      if [ -n "$[[ inputs.config_path ]]" ]; then CONFIG="$[[ inputs.config_path ]]"; else CONFIG=/tmp/gitleaks-preflight.toml; fi
      gitleaks dir --redact --no-banner --config="$CONFIG" --report-format=json --report-path="$CI_PROJECT_DIR/gitleaks.json" .
  artifacts:
    when: always
    paths:
      - gitleaks.json
    expire_in: 30 days
