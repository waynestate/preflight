# mysql56-migrate: run the app's migrations against the MySQL 5.6 that
# Citadel still shares.
#
# CREED's database rule is a MUST: migrations must be proven on a real 5.6
# container, because SQLite accepts DDL that 5.6.51 rejects (a JSON column,
# a too-long utf8mb4 index). This component starts the exact Squire pin,
# mysql:5.6.51, as a GitLab service, waits for it, and runs the app's
# migration command.
#
# The official MySQL 5.6 images are amd64 only, so the job defaults to
# tags: ["amd64"]. On a GitLab without an amd64-tagged runner, set
# tags: [] on an amd64 or emulating runner.
spec:
  component: [name, version, sha, reference]
  description: "Run the app's migrations against MySQL 5.6.51, the version of the shared server on Citadel."
  inputs:
    stage:
      type: string
      default: test
      description: "Pipeline stage for the mysql56-migrate job."
    job_name:
      type: string
      default: mysql56-migrate
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      type: string
      default: "php:8.3-cli-trixie@sha256:628102249d93494233b54490b785f12db9cd60f4dc89416dfca15973f2125f10"
      description: "Container image for the job. It needs PHP 8.3 or later; the job installs any missing php_extensions itself."
    image_prefix:
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      description: "Registry path put in front of the image and service_image values. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      # No trailing slash: the job joins the two as prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
    service_image:
      type: string
      default: "mysql:5.6.51@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae"
      description: "MySQL 5.6.51 service image, the same pin Squire runs locally."
    db_name:
      type: string
      default: app
      description: "Database name created by the service."
    db_user:
      type: string
      default: app
      description: "Database user created by the service."
    db_password:
      type: string
      default: preflight-mysql56-ci
      description: "Throwaway password for the ephemeral service; nothing outside the job connects to it."
    migrate_command:
      type: string
      default: "php artisan migrate --force --no-interaction"
      description: "Command that runs the app's migrations."
    tags:
      type: array
      default: ["amd64"]
      description: "Runner tags for the job. The official MySQL 5.6 images are amd64 only; set an empty list on an amd64 or emulating default runner."
    php_extensions:
      type: array
      default: ["pdo_mysql"]
      description: "PHP extensions installed with docker-php-ext-install unless php -m already lists them."
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  services:
    - name: $[[ inputs.image_prefix ]]/$[[ inputs.service_image ]]
      alias: mysql
  tags: $[[ inputs.tags ]]
  interruptible: true
  timeout: 30 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - if: $CI_MERGE_REQUEST_IID
      when: manual
      allow_failure: true
    - when: never
  cache:
    key: preflight-mysql56-migrate
    paths:
      - .composer-cache/
    policy: pull-push
    when: always  # a failed job still keeps every package that finished downloading
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: $[[ inputs.db_name ]]
    DB_USERNAME: $[[ inputs.db_user ]]
    DB_PASSWORD: $[[ inputs.db_password ]]
    MYSQL_ROOT_PASSWORD: $[[ inputs.db_password ]]
    MYSQL_DATABASE: $[[ inputs.db_name ]]
    MYSQL_USER: $[[ inputs.db_user ]]
    MYSQL_PASSWORD: $[[ inputs.db_password ]]
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    - |
      set -eu
      exts=$(printf '%s' "$[[ inputs.php_extensions ]]" | sed 's/[][",]/ /g')
      for ext in $exts; do
        if ! php -m | grep -qx "$ext"; then
          docker-php-ext-install "$ext"
        fi
      done
      if [ -f composer.json ]; then
        composer install --no-interaction --no-progress
      fi
      ready=0
      i=0
      while [ "$i" -lt 60 ]; do
        if php -r '@new PDO("mysql:host=" . getenv("DB_HOST") . ";port=" . getenv("DB_PORT"), getenv("DB_USERNAME"), getenv("DB_PASSWORD"));'; then
          ready=1
          break
        fi
        i=$((i + 1))
        sleep 2
      done
      if [ "$ready" -ne 1 ]; then
        echo "mysql56-migrate: MySQL did not accept a connection after 120 seconds" >&2
        exit 1
      fi
    - $[[ inputs.migrate_command ]]
