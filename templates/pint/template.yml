# pint: run the app's own Laravel Pint in test mode and fail on style errors.
#
# The component installs the app's dependencies and runs Pint against the
# app's own config. It does not install Pint itself: the app must require
# laravel/pint as a dev dependency and ship a pint.json (or point `config`
# at its own file).
---
spec:
  component: [name, version, sha, reference]
  description: "Run the app's own Laravel Pint in test mode and fail on style errors."
  inputs:
    stage:
      type: string
      default: test
      description: "Pipeline stage for the pint job."
    job_name:
      type: string
      default: pint
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      type: string
      default: "composer:2.10.3@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
      description: "Container image used to run Pint."
    image_prefix:
      description: "Registry path put in front of the image input. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      # No trailing slash: the job joins the two as image_prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
    config:
      type: string
      default: "pint.json"
      description: "Path to the app's Pint config file."
      regex: '^[A-Za-z0-9_-][A-Za-z0-9._/-]*$'
    working_dir:
      type: string
      default: "."
      description: "Directory the app lives in, relative to the repository root."
      regex: '^(\.|[A-Za-z0-9_-][A-Za-z0-9._/-]*)$'
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  interruptible: true
  timeout: 10m
  # The cache is always on. COMPOSER_CACHE_DIR points Composer at a path
  # inside the project so GitLab can cache it. The key is fixed, not a
  # composer.lock hash (D-072): Composer's cache is additive, so a lock
  # change downloads only the packages that changed instead of everything.
  cache:
    key: preflight-pint
    paths:
      - .composer-cache/
    policy: pull-push
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    - cd "$[[ inputs.working_dir ]]"
    - composer install --no-interaction --no-progress --prefer-dist
    - vendor/bin/pint --test --config=$[[ inputs.config ]]
