spec:
  component: [name, version, sha, reference]
  inputs:
    stage:
      description: Pipeline stage for the composer-ci job.
      type: string
      default: test
    job_name:
      type: string
      default: composer-ci
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      description: Docker image for the composer-ci job.
      type: string
      default: composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
    image_prefix:
      description: "Registry path put in front of the image input. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      # No trailing slash: the job joins the two as image_prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
    working_dir:
      description: Directory to run Composer in, relative to the project root.
      type: string
      default: "."
      regex: '^(\.|[A-Za-z0-9_-][A-Za-z0-9._/-]*)$'
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  # The composer image already ships Composer, so no install step for the
  # tool is needed. composer install fetches the app's locked dependencies,
  # and composer ci is the contract: the project's own ci script, whose exit
  # code decides the job. No allow_failure input: a failing composer ci must
  # fail the pipeline.
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  interruptible: true
  timeout: 30 minutes
  cache:
    key: preflight-composer-ci
    paths:
      - .composer-cache/
    policy: pull-push
    when: always
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    - cd "$[[ inputs.working_dir ]]"
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci
