spec:
  component: [name, version, sha, reference]
  inputs:
    job_name:
      type: string
      default: renovate
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      description: Docker image for the renovate job.
      type: string
      default: renovate/renovate:44.229.0@sha256:3cbb11917cc72ad4caf0ad96ade546447656310f2057e33e24a4398779d9330c
    image_prefix:
      description: "Registry path put in front of the image input. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      # No trailing slash: the job joins the two as image_prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
    autodiscover_filter:
      description: Glob limiting which projects Renovate discovers, relative to the runner project's namespace.
      type: string
      default: $CI_PROJECT_NAMESPACE/*
    dry_run:
      description: "Dry run mode for the run: null (disabled), lookup or full."
      type: string
      default: "null"
      # GitLab reads this as a raw RE2 pattern: no slashes around it.
      regex: ^(null|lookup|full)$
    git_author:
      description: Author of the commits and merge requests Renovate creates, in the form Name <email>. Required; the runner project sets it.
      type: string
    squire_kit_tasks:
      description: "Allow the Squire kit commands of Preflight's preset (install the new waynestate/squire from Packagist, then squire update on the kit folder), so a Squire kit merge request arrives with its files refreshed. Off, the merge request bumps the version only and shows an artifact error."
      type: boolean
      default: false
---
"$[[ inputs.job_name ]]":
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  interruptible: true
  timeout: 1 hour
  variables:
    RENOVATE_CONFIG_FILE: $CI_PROJECT_DIR/config.js
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    # RENOVATE_TOKEN and GITHUB_COM_TOKEN are not set here on purpose: a
    # self-reference such as X: $X shadows the project CI/CD variable with
    # the literal text on GitLab 19.5, so the masked project variables reach
    # the job unchanged.
    RENOVATE_AUTODISCOVER: "true"
    RENOVATE_AUTODISCOVER_FILTER: $[[ inputs.autodiscover_filter ]]
    RENOVATE_GIT_AUTHOR: $[[ inputs.git_author ]]
    RENOVATE_DRY_RUN: $[[ inputs.dry_run ]]
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    # The registry alias for the GitLab instance is built at job time from
    # the predefined CI_SERVER_FQDN variable: GitLab expands the key before
    # the shell runs, and Node resolves the value when Renovate loads
    # config.js. No hostname is stored in this file, so the public mirror
    # stays clean.
    #
    # allowedCommands lists the only commands a repository's postUpgradeTasks
    # may run. With squire_kit_tasks on it holds exactly the two commands of
    # the waynestate/squire rule in renovate/default.json, anchored at both
    # ends: Composer installs the new Squire from Packagist into one folder
    # under /tmp (a single safe path segment, never the repository), and that
    # Squire runs `update` on the kit folder (a relative path, no dot-led
    # segments, so no ../). Commands run without a shell, so pipes, ; and
    # $(...) never reach one. tests/check-renovate-squire-kit keeps these
    # patterns and the preset's commands in step.
    - |
      cat > config.js <<'EOF'
      const squireKitTasks = $[[ inputs.squire_kit_tasks ]];
      module.exports = {
        registryAliases: { "$CI_SERVER_FQDN": process.env.CI_SERVER_FQDN },
        allowedCommands: squireKitTasks ? [
          "^composer create-project --no-dev --no-interaction --no-progress --no-scripts waynestate/squire /tmp/renovate-squire/[A-Za-z0-9_-]+ [0-9]+\\.[0-9]+\\.[0-9]+$",
          "^php /tmp/renovate-squire/[A-Za-z0-9_-]+/bin/squire update --path=([A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*)?$"
        ] : []
      };
      EOF
    - renovate
