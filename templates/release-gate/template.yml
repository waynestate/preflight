# release-gate: the D-125 gate for tag pipelines.
#
# When a repo opts its test components into tag_pipeline: release-only, a tag
# pipeline on a commit main already tested runs only the release jobs.
# Skipping the tests is only safe if the default branch already tested this
# exact commit, and this job is the proof. It runs in the .pre stage, before
# every other stage, so a failure stops the whole tag pipeline.
#
# First it asks the GitLab API, with the job token, for a successful pipeline
# of this commit on the default branch. On a GitLab where the job token may
# not read pipelines (or when the API is unreachable), it falls back to git:
# fetch the default branch and check that the tagged commit is an ancestor of
# it. The fallback proves the commit is on the branch, not that it passed
# there; in fallback mode whether it passed rests on the release procedure,
# which says to tag only after the default branch is green.
spec:
  component: [name, version, sha, reference]
  inputs:
    stage:
      description: Pipeline stage for the release-gate job. The default, .pre, runs before every other stage, so a failed gate stops the whole tag pipeline.
      type: string
      default: .pre
    job_name:
      type: string
      default: release-gate
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      description: Docker image for the release-gate job. The default ships git and curl, which the job uses for the API check and the git fallback.
      type: string
      default: composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
    image_prefix:
      description: "Registry path put in front of the image input. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      # No trailing slash: the job joins the two as image_prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  # The gate runs in .pre, before every other stage, so a failure stops the
  # tag pipeline before any release job starts.
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  interruptible: true
  timeout: 5 minutes
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    - |
      set -eu

      echo "Tag: $CI_COMMIT_TAG"
      echo "Commit: $CI_COMMIT_SHA"
      echo "Default branch: $CI_DEFAULT_BRANCH"

      api="${CI_API_V4_URL%/}"
      url="$api/projects/$CI_PROJECT_ID/pipelines?sha=$CI_COMMIT_SHA&ref=$CI_DEFAULT_BRANCH&status=success&per_page=1"

      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT INT TERM

      http_code=$(curl --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "$tmp/pipelines.json" -w '%{http_code}' "$url") || http_code="000"

      case "$http_code" in
        200)
          if [ "$(cat "$tmp/pipelines.json")" = "[]" ]; then
            echo "Commit $CI_COMMIT_SHA has no successful pipeline on $CI_DEFAULT_BRANCH. Tag a commit main has tested, or wait for main's pipeline to finish." >&2
            exit 1
          fi
          if ! pipeline=$(php -r '
            $d = json_decode(file_get_contents($argv[1]), true);
            if (!is_array($d) || count($d) === 0 || !is_array($d[0]) || !isset($d[0]["id"]) || !isset($d[0]["web_url"])) {
              exit(1);
            }
            fwrite(STDOUT, $d[0]["id"] . " " . $d[0]["web_url"]);
          ' "$tmp/pipelines.json"); then
            echo "The pipeline list came back in an unexpected shape; the gate cannot verify the commit." >&2
            exit 1
          fi
          echo "main already passed this commit: pipeline $pipeline"
          exit 0
          ;;
        *)
          # The job token may not read pipelines on this GitLab, so fall back
          # to git. That proves the commit is on the branch, not that it
          # passed there; whether it passed rests on the release procedure.
          echo "The job token cannot list pipelines (HTTP $http_code). Falling back to git: this checks only that the commit is on $CI_DEFAULT_BRANCH. Whether it passed there rests on the release procedure: tag only after main is green."
          if ! git fetch --quiet origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"; then
            echo "Could not fetch $CI_DEFAULT_BRANCH from origin; the gate cannot verify the commit." >&2
            exit 1
          fi
          if git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"; then
            echo "commit is on $CI_DEFAULT_BRANCH"
            exit 0
          fi
          echo "Commit $CI_COMMIT_SHA is not on $CI_DEFAULT_BRANCH: it was never tested there" >&2
          exit 1
          ;;
      esac
