spec:
  component: [name, version, sha, reference]
  inputs:
    stage:
      description: Pipeline stage for the proctor job.
      type: string
      default: test
    job_name:
      type: string
      default: proctor
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      description: Docker image for the proctor job.
      type: string
      default: php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69
    image_prefix:
      description: "Registry path put in front of the image input. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      # No trailing slash: the job joins the two as image_prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
    composer_version:
      description: Composer version to install, 2.9.6 or later.
      type: string
      default: 2.11.1
      # GitLab reads this as a raw RE2 pattern: no slashes around it.
      regex: '^2\.(9\.([6-9]|[1-9][0-9]+)|[1-9][0-9]+\.[0-9]+)$'
      # Floor 2.9.6: older Composer lacks the 2026 security fixes.
    allow_failure:
      description: Whether the proctor job can fail without failing the pipeline.
      type: boolean
      default: false
    proctor_command:
      description: The proctor command to run.
      type: string
      default: vendor/bin/proctor check --format=codequality
    working_dir:
      description: Directory to run the command in, relative to the project root.
      type: string
      default: "."
      regex: '^(\.|[A-Za-z0-9_-][A-Za-z0-9._/-]*)$'
    git_depth:
      description: "How many commits the job clones (GitLab's GIT_DEPTH). The default 0 clones the full history, so PROCTOR's override-approver check can see who wrote each override. Set a number, such as 50, on a very large repository; older override lines then report could-not-run."
      type: string
      default: "0"
      regex: '^[0-9]+$'
    check_path:
      description: "Directory to run the proctor command in, relative to the project root, after the install. Empty (the default) runs it in working_dir. Set it to . to install in a folder such as deploy and run the check from the project root."
      type: string
      default: ""
      regex: '^(\.|[A-Za-z0-9_-][A-Za-z0-9._/-]*)?$'
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  # Boolean input interpolated as a real YAML boolean (docs: an input that
  # replaces an entire YAML value is interpolated as its specified type).
  allow_failure: $[[ inputs.allow_failure ]]
  interruptible: true
  timeout: 30 minutes
  # The cache is always on. COMPOSER_CACHE_DIR points Composer at a path
  # inside the project so GitLab can cache it. The key is fixed, not a
  # composer.lock hash: Composer's cache is additive, so a lock
  # change downloads only the packages that changed instead of everything.
  cache:
    key: preflight-proctor
    paths:
      - .composer-cache/
    policy: pull-push
    when: always  # a failed job still keeps every package that finished downloading
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
    # Full history by default: override-approver reads git blame (0 means no depth limit).
    GIT_DEPTH: "$[[ inputs.git_depth ]]"
    # Where the check runs after the install; empty keeps working_dir.
    PREFLIGHT_PROCTOR_CHECK_PATH: "$[[ inputs.check_path ]]"
    # The command as text, read only by the --record guard in the script.
    # GitLab fills it in as a value, so quotes in the command cannot break it.
    PREFLIGHT_PROCTOR_COMMAND: $[[ inputs.proctor_command ]]
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    # php:8.4-cli-trixie does not ship Composer, unzip or git. The image is
    # Debian-based, so apt is used.
    # Composer is installed with the official getcomposer.org installer;
    # its SHA-384 is fetched at runtime from
    # composer.github.io/installer.sig. The php -r check only verifies the
    # download: on a mismatch it deletes the installer and exits 1. The
    # installer then writes the pinned composer_version to
    # /usr/local/bin/composer, so it is on PATH, and the installer file is
    # removed. No $ variables appear in the php -r code, so GitLab CI
    # variable expansion cannot corrupt it.
    - apt-get update && apt-get install -y --no-install-recommends unzip git
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php -r "if (hash_file('sha384', 'composer-setup.php') !== trim(file_get_contents('https://composer.github.io/installer.sig'))) { unlink('composer-setup.php'); exit(1); }"
    - php composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer --version=$[[ inputs.composer_version ]]
    - rm composer-setup.php
    - cd "$[[ inputs.working_dir ]]"
    # The job only inspects the app, so the app's plugins and scripts must not
    # run with the job's access. It never runs the app either, so the app's
    # PHP version and extensions are not required here: an app locked to
    # PHP 7, or needing gd or oci8, still gets its report.
    - composer install --no-interaction --no-progress --no-plugins --no-scripts --ignore-platform-reqs
    # The install ran in working_dir, but the check can run elsewhere: when
    # check_path is set (say . to scan from the project root), move there so
    # the wayneui.copies scan sees site/assets/wayne-ui at the root.
    - if [ -n "$PREFLIGHT_PROCTOR_CHECK_PATH" ]; then cd "$CI_PROJECT_DIR/$PREFLIGHT_PROCTOR_CHECK_PATH"; fi
    # The --record guard. PROCTOR 0.11.0 and later can also write the JSON
    # report (what --format=json prints) to a file, whatever --format says;
    # Rollcall reads that file from this job's artifact. PROCTOR 0.10.0 and
    # older exit 2 on the unknown option, so the flag is added only when
    # all three hold:
    #   * the command is a plain "proctor check" line: only letters, digits,
    #     spaces and / . _ = : , @ % + - (no ; & | < > $ quotes or globs), so
    #     the flag lands on proctor and not on whatever a shell operator runs
    #     next. A gate command is left alone: its --record writes a deploy
    #     verdict, not the report Rollcall reads.
    #   * it does not already pass --record;
    #   * the app's own PROCTOR lists --record in "check --help".
    # The help run uses the command only up to "proctor check": Symfony's
    # help has its own --format, so "check --format=codequality --help"
    # fails with Unsupported format instead of printing the options.
    # It now runs from the check path, so a relative command such as deploy/vendor/bin/proctor check resolves there too.
    # Nothing here can change the job's result: the help run's exit code is
    # ignored, and the proctor line below still decides pass or fail.
    - |
      PREFLIGHT_PROCTOR_RECORD=
      case "$PREFLIGHT_PROCTOR_COMMAND" in
        *[!A-Za-z0-9\ /._=:,@%+-]*|*--record*) ;;
        *proctor\ check|*proctor\ check\ *)
          preflight_help=$(${PREFLIGHT_PROCTOR_COMMAND%%proctor check*}proctor check --help 2>/dev/null) || true
          case "$preflight_help" in *--record*) PREFLIGHT_PROCTOR_RECORD=1 ;; esac
          ;;
      esac
      if [ -n "$PREFLIGHT_PROCTOR_RECORD" ]; then echo "PROCTOR supports --record: keeping proctor.json as an artifact"; else echo "Not adding --record (PROCTOR 0.10.0 or older, or a custom command): no proctor.json this run"; fi
    # A plain redirect (not tee) keeps proctor's exit code as the job result.
    # The report is written at the project root so the artifact path is the
    # same for every working_dir, including ".". The ${...:+...} adds
    # --record "$CI_PROJECT_DIR/proctor.json" only when the guard set it.
    - $[[ inputs.proctor_command ]] ${PREFLIGHT_PROCTOR_RECORD:+--record "$CI_PROJECT_DIR/proctor.json"} > "$CI_PROJECT_DIR/gl-code-quality-report.json"
  # proctor.json is PROCTOR's JSON report, kept for Rollcall
  # (ROLLCALL_PROCTOR_SOURCE=gitlab reads the newest finished proctor job's
  # proctor.json, passed or failed). An older PROCTOR writes none: the
  # runner then warns "no matching files" and the job keeps its result.
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - proctor.json
    reports:
      codequality: gl-code-quality-report.json
