spec:
  component: [name, version, sha, reference]
  inputs:
    stage:
      description: Pipeline stage for the proctor job.
      type: string
      default: test
    job_name:
      type: string
      default: proctor
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      description: Docker image for the proctor job.
      type: string
      default: php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69
    image_prefix:
      description: "Registry path put in front of the image input. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      # No trailing slash: the job joins the two as image_prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
    composer_version:
      description: Composer version to install.
      type: string
      default: 2.10.3
      # GitLab reads this as a raw RE2 pattern: no slashes around it.
      regex: ^2\.\d+\.\d+$
    allow_failure:
      description: Whether the proctor job can fail without failing the pipeline.
      type: boolean
      default: false
    proctor_command:
      description: The proctor command to run.
      type: string
      default: vendor/bin/proctor check --format=codequality
    working_dir:
      description: Directory to run the command in, relative to the project root.
      type: string
      default: "."
      regex: '^(\.|[A-Za-z0-9_-][A-Za-z0-9._/-]*)$'
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  # Boolean input interpolated as a real YAML boolean (docs: an input that
  # replaces an entire YAML value is interpolated as its specified type).
  allow_failure: $[[ inputs.allow_failure ]]
  interruptible: true
  timeout: 30 minutes
  # The cache is always on. COMPOSER_CACHE_DIR points Composer at a path
  # inside the project so GitLab can cache it. The key depends on
  # composer.lock, so a dependency change invalidates the cache.
  cache:
    key:
      files:
        - composer.lock
      prefix: proctor
    paths:
      - .composer-cache/
    policy: pull-push
  variables:
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    # php:8.4-cli-trixie does not ship Composer, unzip or git. The image is
    # Debian-based, so apt is used.
    # Composer is installed with the official getcomposer.org installer;
    # its SHA-384 is fetched at runtime from
    # composer.github.io/installer.sig. The php -r check only verifies the
    # download: on a mismatch it deletes the installer and exits 1. The
    # installer then writes the pinned composer_version to
    # /usr/local/bin/composer, so it is on PATH, and the installer file is
    # removed. No $ variables appear in the php -r code, so GitLab CI
    # variable expansion cannot corrupt it.
    - apt-get update && apt-get install -y --no-install-recommends unzip git
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php -r "if (hash_file('sha384', 'composer-setup.php') !== trim(file_get_contents('https://composer.github.io/installer.sig'))) { unlink('composer-setup.php'); exit(1); }"
    - php composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer --version=$[[ inputs.composer_version ]]
    - rm composer-setup.php
    - cd "$[[ inputs.working_dir ]]"
    # The job only inspects the app, so the app's plugins and scripts must not
    # run with the job's access. It never runs the app either, so the app's
    # PHP version and extensions are not required here: an app locked to
    # PHP 7, or needing gd or oci8, still gets its report.
    - composer install --no-interaction --no-progress --no-plugins --no-scripts --ignore-platform-reqs
    # A plain redirect (not tee) keeps proctor's exit code as the job result.
    # The report is written at the project root so the artifact path is the
    # same for every working_dir, including ".".
    - $[[ inputs.proctor_command ]] > "$CI_PROJECT_DIR/gl-code-quality-report.json"
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
