# eslint: run the app's own ESLint (and Prettier) and fail on lint or format errors.
#
# The component installs the app's dependencies and runs ESLint and Prettier
# against the app's own config. It does not install ESLint or Prettier itself:
# the app must require @waynestate/pinstripe, eslint and prettier as dev
# dependencies and ship an eslint.config.js (or point `eslint_args` at its own
# files).
---
spec:
  component: [name, version, sha, reference]
  description: "Run the app's own ESLint and Prettier and fail on lint or format errors."
  inputs:
    stage:
      type: string
      default: test
      description: "Pipeline stage for the eslint job."
    job_name:
      type: string
      default: eslint
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      type: string
      default: "node:22.13-alpine@sha256:e2b39f7b64281324929257d0f8004fb6cb4bf0fdfb9aa8cedb235a766aec31da"
      description: "Container image used to run ESLint and Prettier."
    image_prefix:
      description: "Registry path put in front of the image input. The default is this group's GitLab Dependency Proxy, so Docker Hub images are pulled once and then served from GitLab's cache. On a GitLab or group without the proxy, set it to docker.io."
      type: string
      default: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}"
      # No trailing slash: the job joins the two as image_prefix/image.
      regex: '^[^/\s](\S*[^/\s])?$'
    working_dir:
      type: string
      default: "."
      description: "Directory the app lives in, relative to the repository root."
      regex: '^(\.|[A-Za-z0-9_-][A-Za-z0-9._/-]*)$'
    eslint_args:
      type: string
      default: "."
      description: "Arguments passed to eslint (for example a directory or file list)."
    prettier:
      type: boolean
      default: true
      description: "Whether to also run prettier --check."
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image_prefix ]]/$[[ inputs.image ]]
  interruptible: true
  timeout: 15m
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
  script:
    - echo "Preflight component $[[ component.name ]] $[[ component.version ]] (ref $[[ component.reference ]], sha $[[ component.sha ]])"
    - cd "$[[ inputs.working_dir ]]"
    - npm ci --ignore-scripts --cache .npm-cache
    - npx --no-install eslint $[[ inputs.eslint_args ]]
    - if [ "$[[ inputs.prettier ]]" = "true" ]; then npx --no-install prettier --check .; fi
