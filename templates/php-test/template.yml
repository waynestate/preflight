spec:
  inputs:
    stage:
      description: Pipeline stage for the php-test jobs.
      type: string
      default: test
    php_versions:
      description: PHP image references (tag plus digest) to test against, one job per entry.
      type: array
      default:
        - php:8.2-cli@sha256:f7c6b9fc4b410e6fa01160cf72b1c19bce7d5e35fd065c9290fceb15097a480b
        - php:8.3-cli@sha256:98d555ff97b3865140ad31032508c3ca089fa97a8944b14ca9dc03ea05d788cd
        - php:8.4-cli@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
        - php:8.5-cli@sha256:635a4b998025ab269194639a5549c6fdcd9b4f88ec8cd761b092de8653d40663
    test_command:
      description: The test command to run.
      type: string
      default: vendor/bin/phpunit
    working_dir:
      description: Directory to run the command in, relative to the project root.
      type: string
      default: "."
---
php-test:
  stage: $[[ inputs.stage ]]
  # An array input that replaces an entire YAML value is interpolated as its
  # specified type (docs: Input types), so the array feeds parallel:matrix
  # directly. One job is created per entry; PHP_IMAGE becomes a CI/CD variable
  # in each job, which the image line expands. Each entry is a full image
  # reference (tag plus digest), so the readable tag stays next to the pin.
  parallel:
    matrix:
      - PHP_IMAGE: $[[ inputs.php_versions ]]
  image: ${PHP_IMAGE}
  script:
    # php:*-cli images do not ship Composer, unzip or git. The images are
    # Debian-based, so apt is used.
    # Composer is installed with the official getcomposer.org installer;
    # its SHA-384 is fetched at runtime from
    # composer.github.io/installer.sig so the component keeps working when
    # Composer releases a new version. The php -r check only verifies the
    # download: on a mismatch it deletes the installer and exits 1. The
    # installer then writes composer to /usr/local/bin/composer, so it is
    # on PATH, and the installer file is removed. No $ variables appear in
    # the php -r code, so GitLab CI variable expansion cannot corrupt it.
    - apt-get update && apt-get install -y --no-install-recommends unzip git
    - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
    - php -r "if (hash_file('sha384', 'composer-setup.php') !== trim(file_get_contents('https://composer.github.io/installer.sig'))) { unlink('composer-setup.php'); exit(1); }"
    - php composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
    - rm composer-setup.php
    - cd $[[ inputs.working_dir ]]
    - composer install --no-interaction --no-progress
    - $[[ inputs.test_command ]]
