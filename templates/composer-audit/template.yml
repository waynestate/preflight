spec:
  inputs:
    stage:
      description: Pipeline stage for the composer-audit job.
      type: string
      default: test
    job_name:
      type: string
      default: composer-audit
      description: "Name of the job. Set it when you include this component more than once."
      regex: '^[A-Za-z0-9_][A-Za-z0-9_.-]*$'
    image:
      description: Docker image for the composer-audit job.
      type: string
      default: composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc
    working_dir:
      description: Directory to run composer audit in, relative to the project root.
      type: string
      default: "."
      regex: '^(\.|[A-Za-z0-9_-][A-Za-z0-9._/-]*)$'
    abandoned:
      description: "How composer audit treats abandoned packages: fail (default), report (list them, do not fail) or ignore."
      type: string
      default: fail
      regex: '^(fail|report|ignore)$'
---
"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  # The composer:2 image already ships Composer, so no install step is
  # needed. composer audit --locked exits non-zero when it finds advisories,
  # which fails the job. Abandoned packages fail by default (Composer's own
  # default); the abandoned input relaxes that on purpose: report lists them
  # without failing, ignore skips them. No allow_failure input: advisories
  # must fail.
  image: $[[ inputs.image ]]
  interruptible: true
  timeout: 30 minutes
  script:
    - cd "$[[ inputs.working_dir ]]"
    - composer audit --locked --abandoned=$[[ inputs.abandoned ]]
